project:
  type: website
  resources:
    - brand/icon-sun.svg
    - brand/icon-moon.svg

website:
  title: "Andres Lanzos"
  site-url: "https://andreslanzos.quarto.pub/portfolio/"
  description: "Portfolio of Andres Lanzos, a biomedical data scientist working across translational omics, biomarker discovery and ML products."
  favicon: "jpg/photo.jpg"
  open-graph: true
  twitter-card: true
  reader-mode: false
  page-navigation: true
  back-to-top-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    background: primary
    left:
      - href: index.qmd
        text: About
      - href: projects.qmd
        text: Projects
      - href: articles/index.qmd
        text: Articles
      - href: resume.qmd
        text: CV
    right:
      - icon: rss
        href: articles/index.xml
        aria-label: Articles RSS feed
      - icon: envelope
        href: mailto:andreslanzos@gmail.com
        aria-label: Email Andres Lanzos
      - icon: linkedin
        href: https://www.linkedin.com/in/andreslanzos/
        aria-label: LinkedIn profile
      - icon: github
        href: https://github.com/alanzos
        aria-label: GitHub profile
  page-footer:
    border: true
    left: |
      © 2026 Andres Lanzos · Basel, Switzerland
    center: |
      [andreslanzos@gmail.com](mailto:andreslanzos@gmail.com)
    right: |
      [Subscribe to my articles](https://buttondown.com/andreslanzos) · [LinkedIn](https://www.linkedin.com/in/andreslanzos/) · [GitHub](https://github.com/alanzos)

format:
  html:
    theme:
      dark: darkly
      light: flatly
    css: styles.css
    toc: false
    link-external-newwindow: true
    link-external-icon: true
    link-external-filter: '^(?:https?:)?//andreslanzos\.quarto\.pub(?:/|$)'
    smooth-scroll: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet">

editor: visual
