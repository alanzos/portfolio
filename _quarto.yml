project:
  type: website

website:
  title: "Andres Lanzos"
  site-url: "https://andreslanzos.quarto.pub/"
  description: "Portfolio of Andres Lanzos, a biomedical data scientist working across translational omics, biomarker discovery and ML products."
  favicon: "jpg/photo.jpg"
  open-graph: true
  twitter-card: true
  reader-mode: false
  page-navigation: true
  back-to-top-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    background: primary
    left:
      - href: index.qmd
        text: About
      - href: projects.qmd
        text: Projects
      - href: resume.qmd
        text: CV
    right:
      - icon: envelope
        href: mailto:andreslanzos@gmail.com
        aria-label: Email Andres Lanzos
      - icon: linkedin
        href: https://www.linkedin.com/in/andreslanzos/
        aria-label: LinkedIn profile
      - icon: github
        href: https://github.com/alanzos
        aria-label: GitHub profile
  page-footer:
    border: true
    left: |
      © 2026 Andres Lanzos · Basel, Switzerland
    center: |
      [andreslanzos@gmail.com](mailto:andreslanzos@gmail.com)
    right: |
      [LinkedIn](https://www.linkedin.com/in/andreslanzos/) · [GitHub](https://github.com/alanzos)

format:
  html:
    theme:
      dark: darkly
      light: cosmo
    css: styles.css
    link-external-newwindow: true
    link-external-icon: true
    link-external-filter: '^(?:https?:)?//andreslanzos\.quarto\.pub(?:/|$)'
    smooth-scroll: true

editor: visual
